# VDE (Victorious Desktop Environment) — Terminal Configuration
# Fluent Dark Mica / Acrylic Terminal Styling for Foot

[main]
font=monospace:size=11,DejaVu Sans Mono:size=11
pad=12x12
term=xterm-256color
app-id=foot
title=VDE Terminal

[colors]
alpha=0.92
background=18181b
foreground=fafafa

## Normal colors (Dark Mica Palette)
regular0=18181b
regular1=ef4444
regular2=22c55e
regular3=eab308
regular4=38bdf8
regular5=a855f7
regular6=06b6d4
regular7=f4f4f5

## Bright colors
bright0=27272a
bright1=f87171
bright2=4ade80
bright3=fde047
bright4=60a5fa
bright5=c084fc
bright6=22d3ee
bright7=ffffff

[cursor]
style=underline
color=18181b fafafa
blink=yes

[mouse]
hide-when-typing=yes
